name: Explanation Visual Audit

on:
  pull_request:
    paths:
      - 'explanation-*.js'
      - 'component-contract.js'
      - 'grammatical-components.js'
      - 'derivational-components.js'
      - 'index.html'
      - 'style.css'
      - 'explanation-ui.css'
      - 'tests/visual/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/explanation-visual-audit.yml'
  workflow_dispatch:

jobs:
  explanation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run explanation audit
        run: npm run test:visual

      - name: Upload Section 01 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section01-explanation-screenshots
          path: test-results/section01-explanations/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 02 Majzum screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section02-majzum-screenshots
          path: test-results/section02-explanations/01-Majzum-Present/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 02 Mansub screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section02-mansub-screenshots
          path: test-results/section02-explanations/02-Mansub-Present/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 02 Heavy Emphasis screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section02-heavy-emphasis-screenshots
          path: test-results/section02-explanations/03-Heavy-Emphasis/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 02 Light Emphasis screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section02-light-emphasis-screenshots
          path: test-results/section02-explanations/04-Light-Emphasis/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 03 Imperative screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section03-imperative-screenshots
          path: test-results/section03-explanations/01-Imperative/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 03 Heavy Imperative screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section03-heavy-imperative-screenshots
          path: test-results/section03-explanations/02-Heavy-Imperative/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Section 03 Light Imperative screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section03-light-imperative-screenshots
          path: test-results/section03-explanations/03-Light-Imperative/*.png
          if-no-files-found: warn
          retention-days: 7
